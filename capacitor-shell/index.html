<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Mentara</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5efe6;
        color: #1f2937;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.9), transparent 50%),
          linear-gradient(180deg, #f7f1e8 0%, #efe4d1 100%);
      }

      main {
        max-width: 440px;
        text-align: center;
      }

      h1 {
        margin-bottom: 12px;
        font-size: 32px;
      }

      p {
        margin: 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mentara</h1>
      <p>
        This iOS build loads the hosted Mentara experience. If you are seeing
        this screen, confirm that <code>CAPACITOR_SERVER_URL</code> points to
        the live HTTPS deployment before syncing the app.
      </p>
    </main>
  </body>
</html>
